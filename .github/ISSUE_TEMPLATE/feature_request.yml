name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain who needs this and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Relevant official sources or examples
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This proposal preserves official source links and does not overstate recall certainty.
          required: true
