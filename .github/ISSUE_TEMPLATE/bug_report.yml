name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private product or account information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL
      description: Required for recall-data corrections when available.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, commit, and relevant logs.
    validations:
      required: true
